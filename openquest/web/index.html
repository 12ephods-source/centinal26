<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenQuest Character Creator</title>
<style>:root{font-family:system-ui,sans-serif;color:#171717;background:#f3f4f6}body{margin:0}main{max-width:860px;margin:auto;padding:24px}.card{background:white;border:1px solid #d1d5db;border-radius:14px;padding:18px;margin:14px 0}h1{margin:0 0 4px}.muted{color:#60656f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{display:grid;gap:5px;font-weight:650}input,select,button{font:inherit;padding:10px;border:1px solid #aab0b8;border-radius:8px;background:white}button{cursor:pointer;background:#171717;color:white;border-color:#171717;font-weight:700}.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.skills label{display:flex;align-items:center;gap:7px;font-weight:500}.status{padding:10px;border-radius:8px;background:#eef2f7;white-space:pre-wrap}.error{background:#fee2e2}.success{background:#dcfce7}pre{overflow:auto;background:#111827;color:#e5e7eb;padding:14px;border-radius:9px;max-height:360px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.small{font-size:.9rem}</style></head>
<body><main><section class="card"><h1>OpenQuest Character Creator</h1><p class="muted">Bounded level-1 creator using versioned SRD profiles. Unsupported choices fail closed.</p></section>
<section class="card"><h2>Saved characters</h2><div class="row"><select id="saved"><option value="">No saved character selected</option></select><button id="reload" type="button">Refresh</button><button id="openSaved" type="button">Open</button></div></section>
<form id="creator" class="card"><div class="grid"><label>Name<input id="name" value="OpenQuest Hero" required></label><label>Ruleset<select id="ruleset"><option value="srd-5.2.1">SRD 5.2.1 (2024 default)</option><option value="srd-5.1">SRD 5.1 (2014 compatibility)</option></select></label><label>Class<select id="className"></select></label><label>Species<select id="species"></select></label><label>Background<select id="background"></select></label><label>Armor class<input id="armorClass" type="number" min="1" max="40" value="10"></label></div><h2>Standard array</h2><p class="muted small">Assign each value exactly once.</p><div id="abilities" class="grid"></div><h2>Class skills</h2><p id="skillHint" class="muted small"></p><div id="skills" class="skills"></div><p class="row"><button type="submit">Create & validate</button><button id="createSave" type="button">Create, validate & save</button></p></form>
<section class="card"><h2>Validation</h2><div id="status" class="status">Loading legal options…</div></section><section id="resultCard" class="card" hidden><div class="row"><h2>Finished character</h2><button id="download" type="button">Download JSON</button></div><pre id="result"></pre></section></main>
<script>
const abilities=['str','dex','con','int','wis','cha'],standard=[15,14,13,12,10,8],fighterSkills=['acrobatics','animal handling','athletics','history','insight','intimidation','perception','persuasion','survival'];
const abilityBox=document.querySelector('#abilities'),skillsBox=document.querySelector('#skills'),statusBox=document.querySelector('#status'),resultCard=document.querySelector('#resultCard'),resultBox=document.querySelector('#result'),saved=document.querySelector('#saved');
for(const ability of abilities){const l=document.createElement('label');l.textContent=ability.toUpperCase();const s=document.createElement('select');s.id='ability-'+ability;for(const n of standard){const o=document.createElement('option');o.value=n;o.textContent=n;s.append(o)}s.value=standard[abilities.indexOf(ability)];l.append(s);abilityBox.append(l)}
for(const skill of fighterSkills){const l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.value=skill;b.name='skill';l.append(b,document.createTextNode(skill));skillsBox.append(l)}document.querySelectorAll('input[name=skill]')[2].checked=true;document.querySelectorAll('input[name=skill]')[6].checked=true;
function setStatus(t,c=''){statusBox.textContent=t;statusBox.className='status '+c}
async function loadOptions(){const ruleset=document.querySelector('#ruleset').value;try{const r=await fetch('/v1/options?ruleset='+encodeURIComponent(ruleset)),d=await r.json();if(!r.ok)throw new Error(d.gates?.[0]?.detail||'Option request failed');for(const [id,key] of [['className','classes'],['species','species'],['background','backgrounds']]){const el=document.querySelector('#'+id);el.innerHTML='';for(const value of d.options[key]){const o=document.createElement('option');o.value=value;o.textContent=value;el.append(o)}}document.querySelector('#skillHint').textContent='Choose exactly two Fighter skills.';setStatus('Legal choices loaded from '+ruleset+'.')}catch(e){setStatus(String(e),'error')}}
async function loadSaved(){try{const r=await fetch('/v1/characters'),d=await r.json();saved.innerHTML='<option value="">Select saved character</option>';for(const c of d.characters){const o=document.createElement('option');o.value=c.id;o.textContent=c.name+' — '+c.ruleset;saved.append(o)}}catch(e){setStatus(String(e),'error')}}
function payload(save=false){const a={};for(const x of abilities)a[x]=Number(document.querySelector('#ability-'+x).value);return{name:document.querySelector('#name').value,ruleset:document.querySelector('#ruleset').value,class_name:document.querySelector('#className').value,species:document.querySelector('#species').value,background:document.querySelector('#background').value,armor_class:Number(document.querySelector('#armorClass').value),ability_scores:a,skill_proficiencies:[...document.querySelectorAll('input[name=skill]:checked')].map(x=>x.value),save}}
async function create(save=false){setStatus('Validating…');resultCard.hidden=true;try{const r=await fetch('/v1/characters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload(save))}),d=await r.json();if(!r.ok){setStatus((d.gates||[]).map(g=>g.gate+': '+g.detail).join('\n')||'Validation failed','error');return}resultBox.textContent=JSON.stringify(d.result,null,2);resultCard.hidden=false;setStatus(save?'PASS — validated and saved.':'PASS — character created and independently validated.','success');if(save)await loadSaved()}catch(e){setStatus(String(e),'error')}}
document.querySelector('#ruleset').addEventListener('change',loadOptions);document.querySelector('#creator').addEventListener('submit',e=>{e.preventDefault();create(false)});document.querySelector('#createSave').addEventListener('click',()=>create(true));document.querySelector('#reload').addEventListener('click',loadSaved);document.querySelector('#openSaved').addEventListener('click',async()=>{if(!saved.value)return;try{const r=await fetch('/v1/characters/'+saved.value),d=await r.json();if(!r.ok)throw new Error(d.gates?.[0]?.detail||'Load failed');resultBox.textContent=JSON.stringify(d.record.character,null,2);resultCard.hidden=false;setStatus('PASS — stored character hash verified and reopened.','success')}catch(e){setStatus(String(e),'error')}});document.querySelector('#download').addEventListener('click',()=>{const b=new Blob([resultBox.textContent+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='openquest-character.json';a.click();URL.revokeObjectURL(a.href)});loadOptions();loadSaved();
</script></body></html>
