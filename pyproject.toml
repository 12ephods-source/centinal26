[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centinal26"
version = "0.1.0"
description = "Wazoo26 local-first evidence-centered automation runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Robert Frost"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wazoo26 = "centinal26.cli:main"
centinal26 = "centinal26.cli:main"
frost = "centinal26.frost_cli:main"
centinal26-intelligence = "frost_core.intelligence_cli:main"
centinal26-fleet = "frost_core.fleet_cli:main"
frost-export-recovery = "frost_core.export_recovery:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["centinal26*", "frost_core*", "automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# HERMES bridge/plugin boundaries intentionally convert arbitrary runtime/provider
# failures into diagnostic records instead of allowing plugin failures to escape.
"deploy/hermes-c05/hermes_c05_bridge.py" = ["EXE001", "TRY004", "BLE001"]
"deploy/hermes-c05/plugin/frost_orchestrator/tools.py" = ["I001", "PLW1510", "BLE001"]
"tests/test_hermes_c05_adapter.py" = ["I001"]
