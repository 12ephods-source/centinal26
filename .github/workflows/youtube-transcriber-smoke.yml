name: YouTube transcriber real-video smoke

on:
  push:
    branches:
      - agent/youtube-transcriber-v1.3.0
    paths:
      - .github/workflows/youtube-transcriber-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIDEO_ID: tr9AqDYxFI4
      TARGET_URL: https://youtu.be/tr9AqDYxFI4?si=MFmYG-GJh1iEMz8c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/jdepoix/youtube-transcript-api.git@v1.2.4'
          mkdir -p "$HOME/.local/bin" work evidence
          curl -fL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp_linux \
            -o "$HOME/.local/bin/yt-dlp"
          chmod +x "$HOME/.local/bin/yt-dlp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Try direct caption API
        id: captions
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from youtube_transcript_api import YouTubeTranscriptApi

          vid = os.environ['VIDEO_ID']
          out = Path('work')
          out.mkdir(exist_ok=True)
          api = YouTubeTranscriptApi()
          transcripts = api.list(vid)
          chosen = next(iter(transcripts))
          fetched = chosen.fetch()
          text = '\n'.join(str(item.text).strip() for item in fetched if str(item.text).strip())
          if not text.strip():
              raise RuntimeError('caption API returned an empty transcript')
          (out / 'transcript.txt').write_text(text + '\n', encoding='utf-8')
          (out / 'source.json').write_text(json.dumps({
              'method': 'youtube-transcript-api',
              'language_code': getattr(chosen, 'language_code', None),
              'is_generated': getattr(chosen, 'is_generated', None),
          }, indent=2) + '\n', encoding='utf-8')
          print(f'caption transcript acquired: {len(text)} chars')
          PY

      - name: Try Piped subtitle frontends
        id: piped_captions
        if: steps.captions.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          vid = os.environ['VIDEO_ID']
          instances = [
              'https://pipedapi.kavin.rocks',
              'https://pipedapi-libre.kavin.rocks',
              'https://pipedapi.leptons.xyz',
              'https://piped-api.privacy.com.de',
              'https://pipedapi.adminforge.de',
              'https://api.piped.yt',
              'https://api.piped.private.coffee',
              'https://pipedapi.orangenet.cc',
          ]
          attempts = []
          out = Path('work')
          out.mkdir(exist_ok=True)

          def get(url, timeout=20):
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0 transcript-validation/1.0'})
              with urlopen(req, timeout=timeout) as r:
                  return r.read(), r.headers.get_content_type()

          def subtitle_to_text(raw, mime):
              s = raw.decode('utf-8', errors='replace').replace('\ufeff', '')
              if 'xml' in mime or '<text' in s or '<p ' in s:
                  chunks = re.findall(r'<(?:text|p)\b[^>]*>(.*?)</(?:text|p)>', s, flags=re.I | re.S)
                  lines = [html.unescape(re.sub(r'<[^>]+>', '', x)).strip() for x in chunks]
                  return '\n'.join(x for x in lines if x)
              lines = []
              for line in s.splitlines():
                  x = line.strip()
                  if not x or x.upper() == 'WEBVTT' or '-->' in x or re.fullmatch(r'\d+', x):
                      continue
                  if x.startswith(('Kind:', 'Language:', 'NOTE ')):
                      continue
                  x = re.sub(r'<[^>]+>', '', x)
                  x = html.unescape(x).strip()
                  if x and (not lines or x != lines[-1]):
                      lines.append(x)
              return '\n'.join(lines)

          for base in instances:
              try:
                  raw, _ = get(f'{base}/streams/{vid}')
                  info = json.loads(raw)
                  subs = info.get('subtitles') or []
                  if not subs:
                      attempts.append({'instance': base, 'result': 'no_subtitles'})
                      continue
                  subs.sort(key=lambda s: (
                      0 if str(s.get('code', '')).lower().startswith('en') else 1,
                      1 if s.get('autoGenerated') else 0,
                  ))
                  for sub in subs:
                      url = sub.get('url')
                      if not url:
                          continue
                      try:
                          subraw, mime = get(url)
                          text = subtitle_to_text(subraw, mime or str(sub.get('mimeType') or ''))
                          if len(text.split()) < 20:
                              continue
                          (out / 'transcript.txt').write_text(text + '\n', encoding='utf-8')
                          (out / 'source.json').write_text(json.dumps({
                              'method': 'piped-subtitle',
                              'instance': base,
                              'title': info.get('title'),
                              'language_code': sub.get('code'),
                              'mime_type': sub.get('mimeType') or mime,
                              'is_generated': sub.get('autoGenerated'),
                          }, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
                          (out / 'piped_attempts.json').write_text(json.dumps(attempts, indent=2) + '\n')
                          print(f'Piped subtitle acquired via {base}: {len(text)} chars')
                          raise SystemExit(0)
                      except Exception as e:
                          attempts.append({'instance': base, 'subtitle': str(sub.get('code')), 'error': f'{type(e).__name__}: {e}'})
              except SystemExit:
                  raise
              except Exception as e:
                  attempts.append({'instance': base, 'error': f'{type(e).__name__}: {e}'})
          (out / 'piped_attempts.json').write_text(json.dumps(attempts, indent=2) + '\n')
          raise RuntimeError('all Piped subtitle routes failed')
          PY

      - name: Download direct YouTube audio
        id: direct_audio
        if: steps.captions.outcome == 'failure' && steps.piped_captions.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          yt-dlp --js-runtimes node --no-playlist -f 'bestaudio/best' -x --audio-format wav -o 'work/source.%(ext)s' "$TARGET_URL"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            yt-dlp --js-runtimes node --extractor-args 'youtube:player_client=web_safari' --no-playlist -f 'bestaudio/best' -x --audio-format wav -o 'work/source.%(ext)s' "$TARGET_URL"
            rc=$?
          fi
          set -e
          test "$rc" -eq 0
          src="$(find work -maxdepth 1 -type f -name 'source*.wav' | head -n1)"
          test -n "$src"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -ar 16000 -ac 1 -c:a pcm_s16le work/normalized.wav
          test -s work/normalized.wav

      - name: Download Piped audio fallback
        id: piped_audio
        if: steps.captions.outcome == 'failure' && steps.piped_captions.outcome == 'failure' && steps.direct_audio.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          vid = os.environ['VIDEO_ID']
          instances = [
              'https://pipedapi.kavin.rocks',
              'https://pipedapi-libre.kavin.rocks',
              'https://pipedapi.leptons.xyz',
              'https://piped-api.privacy.com.de',
              'https://pipedapi.adminforge.de',
              'https://api.piped.yt',
              'https://api.piped.private.coffee',
              'https://pipedapi.orangenet.cc',
          ]
          attempts = []

          def get(url, timeout=30):
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0 transcript-validation/1.0'})
              with urlopen(req, timeout=timeout) as r:
                  return r.read()

          for base in instances:
              try:
                  info = json.loads(get(f'{base}/streams/{vid}'))
                  streams = info.get('audioStreams') or []
                  streams = [s for s in streams if s.get('url')]
                  if not streams:
                      attempts.append({'instance': base, 'result': 'no_audio_streams'})
                      continue
                  streams.sort(key=lambda s: int(s.get('bitrate') or 10**9))
                  for stream in streams[:3]:
                      try:
                          raw = get(stream['url'], timeout=90)
                          if len(raw) < 10000:
                              raise RuntimeError(f'audio payload too small: {len(raw)} bytes')
                          Path('work/piped-audio.bin').write_bytes(raw)
                          Path('work/source.json').write_text(json.dumps({
                              'method': 'piped-audio+whisper',
                              'instance': base,
                              'title': info.get('title'),
                              'format': stream.get('format'),
                              'mime_type': stream.get('mimeType'),
                              'bitrate': stream.get('bitrate'),
                          }, indent=2, ensure_ascii=False) + '\n')
                          Path('work/piped_audio_attempts.json').write_text(json.dumps(attempts, indent=2) + '\n')
                          print(f'Piped audio acquired via {base}: {len(raw)} bytes')
                          raise SystemExit(0)
                      except Exception as e:
                          attempts.append({'instance': base, 'error': f'{type(e).__name__}: {e}'})
              except SystemExit:
                  raise
              except Exception as e:
                  attempts.append({'instance': base, 'error': f'{type(e).__name__}: {e}'})
          Path('work/piped_audio_attempts.json').write_text(json.dumps(attempts, indent=2) + '\n')
          raise RuntimeError('all Piped audio routes failed')
          PY
          ffmpeg -hide_banner -loglevel error -y -i work/piped-audio.bin -ar 16000 -ac 1 -c:a pcm_s16le work/normalized.wav
          test -s work/normalized.wav

      - name: Whisper fallback
        id: whisper
        if: steps.captions.outcome == 'failure' && steps.piped_captions.outcome == 'failure' && (steps.direct_audio.outcome == 'success' || steps.piped_audio.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/whisper-bin /tmp/whisper-model
          curl -fL --retry 3 \
            https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-ubuntu-x64.tar.gz \
            -o /tmp/whisper.tar.gz
          tar -xzf /tmp/whisper.tar.gz -C /tmp/whisper-bin
          cli="$(find /tmp/whisper-bin -type f -name whisper-cli -perm -111 | head -n1)"
          test -n "$cli"
          curl -fL --retry 3 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin \
            -o /tmp/whisper-model/ggml-base.bin
          "$cli" -m /tmp/whisper-model/ggml-base.bin -f work/normalized.wav -l auto -otxt -of work/whisper
          test -s work/whisper.txt
          mv work/whisper.txt work/transcript.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('work/source.json')
          src = json.loads(p.read_text()) if p.exists() else {}
          src.update({'transcriber': 'whisper.cpp', 'model': 'ggml-base.bin', 'whisper_cpp': 'v1.9.2'})
          p.write_text(json.dumps(src, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Generate validation or blocked evidence
        id: evidence
        if: always()
        shell: bash
        env:
          CAPTION_OUTCOME: ${{ steps.captions.outcome }}
          PIPED_CAPTION_OUTCOME: ${{ steps.piped_captions.outcome }}
          DIRECT_AUDIO_OUTCOME: ${{ steps.direct_audio.outcome }}
          PIPED_AUDIO_OUTCOME: ${{ steps.piped_audio.outcome }}
          WHISPER_OUTCOME: ${{ steps.whisper.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          p = Path('work/transcript.txt')
          source_path = Path('work/source.json')
          source = json.loads(source_path.read_text()) if source_path.exists() else {'method': 'none'}
          outcomes = {
              'direct_caption': os.environ.get('CAPTION_OUTCOME'),
              'piped_caption': os.environ.get('PIPED_CAPTION_OUTCOME'),
              'direct_audio': os.environ.get('DIRECT_AUDIO_OUTCOME'),
              'piped_audio': os.environ.get('PIPED_AUDIO_OUTCOME'),
              'whisper': os.environ.get('WHISPER_OUTCOME'),
          }
          evidence = {
              'video_id': os.environ['VIDEO_ID'],
              'target_url': os.environ['TARGET_URL'],
              'source': source,
              'step_outcomes': outcomes,
              'copyright_note': 'Full transcript is transient and intentionally not uploaded by this public smoke gate.'
          }
          if p.exists() and p.stat().st_size > 0:
              raw = p.read_bytes()
              text = raw.decode('utf-8', errors='replace')
              normalized = ' '.join(text.split())
              evidence.update({
                  'status': 'PASS',
                  'transcript_bytes': len(raw),
                  'transcript_characters': len(text),
                  'transcript_words': len(text.split()),
                  'transcript_sha256': hashlib.sha256(raw).hexdigest(),
                  'nonempty': bool(text.strip()),
                  'bounded_excerpt': normalized[:80],
                  'bounded_excerpt_characters': min(80, len(normalized)),
              })
          else:
              evidence.update({
                  'status': 'BLOCKED',
                  'nonempty': False,
                  'reason': 'No caption or audio route produced a transcript on this hosted runner.',
              })
          for name in ('piped_attempts.json', 'piped_audio_attempts.json'):
              fp = Path('work') / name
              if fp.exists():
                  evidence[name.removesuffix('.json')] = json.loads(fp.read_text())
          out = Path('evidence')
          out.mkdir(exist_ok=True)
          (out / 'REAL_VIDEO_VALIDATION.json').write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({k: evidence.get(k) for k in ('status','video_id','transcript_bytes','transcript_words','transcript_sha256','reason')}, indent=2))
          PY
          rm -f work/transcript.txt work/normalized.wav work/source*.wav work/piped-audio.bin

      - name: Upload validation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcriber-real-video-validation
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce real-video gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('evidence/REAL_VIDEO_VALIDATION.json').read_text())
          if evidence.get('status') != 'PASS':
              raise SystemExit('real-video transcription gate remains BLOCKED')
          print('real-video transcription gate PASS')
          PY
