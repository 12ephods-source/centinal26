name: FToE SO10 422 Gate

on:
  pull_request:
    paths:
      - 'scripts/ftoe_so10_422_gate.py'
      - 'scripts/ftoe_so10_422_branch_scan.py'
      - 'scripts/ftoe_so10_422_2d_roots.py'
      - 'scripts/ftoe_so10_422_postprocess.py'
      - 'scripts/ftoe_so10_operator_gate.py'
      - 'scripts/ftoe_so10_naturalness_gate.py'
      - 'scripts/ftoe_so10_radiative_protection_gate.py'
      - 'scripts/ftoe_so10_threshold_gate.py'
      - 'scripts/ftoe_so10_threshold_stress.py'
      - 'scripts/diagnose_so10_422_rge_conventions.py'
      - 'tests/test_ftoe_so10_422_gate.py'
      - 'tests/test_ftoe_so10_uv_closure.py'
      - 'tests/test_ftoe_so10_threshold_stress.py'
      - 'docs/physics/FTOE_SO10_422_CLOSURE.md'
      - '.github/workflows/ftoe-so10-422-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit published G422 coefficient discrepancy
        run: python scripts/diagnose_so10_422_rge_conventions.py
      - name: Run deterministic gauge tests
        run: python -m unittest tests.test_ftoe_so10_422_gate -v
      - name: Run deterministic UV closure tests
        run: python -m unittest tests.test_ftoe_so10_uv_closure -v
      - name: Run adversarial threshold-stress regression tests
        run: python -m unittest tests.test_ftoe_so10_threshold_stress -v
      - name: Generate machine-readable closure artifacts
        run: |
          mkdir -p artifacts/ftoe-so10-422
          python scripts/ftoe_so10_422_2d_roots.py --threshold reference --json artifacts/ftoe-so10-422/reference_2hdm_roots.json
          python scripts/ftoe_so10_422_2d_roots.py --threshold ftoe --json artifacts/ftoe-so10-422/ftoe_threshold_roots.json
          python scripts/ftoe_so10_422_postprocess.py > artifacts/ftoe-so10-422/ftoe_postprocess.json
          python scripts/ftoe_so10_operator_gate.py --MU 2.04990990688745e16 --json artifacts/ftoe-so10-422/operator_gate.json
          python scripts/ftoe_so10_naturalness_gate.py --MU 2.04990990688745e16 --muI 9.54e3 --alphaU 0.032067325570772874 --json artifacts/ftoe-so10-422/naturalness_gate.json
          python scripts/ftoe_so10_radiative_protection_gate.py --f 2.04990990688745e16 --muI 9.54e3 --alphaU 0.032067325570772874 --json artifacts/ftoe-so10-422/radiative_protection_gate.json
          python scripts/ftoe_so10_threshold_stress.py --json artifacts/ftoe-so10-422/threshold_stress.json
          python scripts/diagnose_so10_422_rge_conventions.py > artifacts/ftoe-so10-422/coefficient_source_audit.json
          sha256sum artifacts/ftoe-so10-422/*.json > artifacts/ftoe-so10-422/SHA256SUMS.txt
      - name: Upload closure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftoe-so10-422-closure
          path: artifacts/ftoe-so10-422/
