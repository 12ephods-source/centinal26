name: FToE SO10 422 Gate

on:
  pull_request:
    paths:
      - 'scripts/ftoe_so10_422_gate.py'
      - 'scripts/ftoe_so10_422_branch_scan.py'
      - 'scripts/ftoe_so10_422_2d_roots.py'
      - 'scripts/diagnose_so10_422_rge_conventions.py'
      - 'tests/test_ftoe_so10_422_gate.py'
      - 'docs/physics/FTOE_SO10_422_CLOSURE.md'
      - '.github/workflows/ftoe-so10-422-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose printed RGE conventions and seal log
        run: |
          python scripts/diagnose_so10_422_rge_conventions.py
          exit 86
