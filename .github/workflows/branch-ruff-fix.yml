name: branch-ruff-fix

on:
  push:
    branches: ["agent/run-everything-host-federation"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/run-everything-host-federation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Apply scoped Ruff fixes
        run: |
          ruff check --fix --unsafe-fixes \
            scripts/host-federation-gate.py \
            src/frost_core/effects.py \
            src/frost_core/federation.py \
            src/frost_core/provenance_miner.py \
            src/frost_core/providers.py \
            src/frost_core/software_creation.py \
            tests/test_frost_core_remaining_features.py
          ruff check \
            scripts/host-federation-gate.py \
            src/frost_core/effects.py \
            src/frost_core/federation.py \
            src/frost_core/provenance_miner.py \
            src/frost_core/providers.py \
            src/frost_core/software_creation.py \
            tests/test_frost_core_remaining_features.py
      - name: Commit only scoped fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/host-federation-gate.py \
            src/frost_core/effects.py \
            src/frost_core/federation.py \
            src/frost_core/provenance_miner.py \
            src/frost_core/providers.py \
            src/frost_core/software_creation.py \
            tests/test_frost_core_remaining_features.py
          git commit -m "Apply scoped Ruff fixes to federation batch"
          git push origin HEAD:agent/run-everything-host-federation
