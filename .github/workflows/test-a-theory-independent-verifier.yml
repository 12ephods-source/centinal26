name: Test-a-Theory Independent Verifier

on:
  pull_request:
    paths:
      - 'src/centinal26/test_a_theory.py'
      - 'scripts/test_a_theory.py'
      - 'scripts/verify_g15_test_a_theory.py'
      - 'validation/test_a_theory/**'
      - 'automation/account_goals/GOALS.json'
      - 'automation/account_goals/G15_INDEPENDENT_VERIFICATION.json'
      - '.github/workflows/test-a-theory-independent-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'src/centinal26/test_a_theory.py'
      - 'scripts/test_a_theory.py'
      - 'scripts/verify_g15_test_a_theory.py'
      - 'validation/test_a_theory/**'
      - 'automation/account_goals/GOALS.json'
      - 'automation/account_goals/G15_INDEPENDENT_VERIFICATION.json'
      - '.github/workflows/test-a-theory-independent-verifier.yml'

jobs:
  independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install -e .
      - name: Run black-box G15 verifier
        run: python scripts/verify_g15_test_a_theory.py | tee G15_INDEPENDENT_VERIFICATION.json
      - name: Upload independent verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: g15-independent-verification
          path: G15_INDEPENDENT_VERIFICATION.json
          if-no-files-found: error
