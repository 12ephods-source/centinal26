name: Phase I regulated KMS BKM v2

on:
  push:
    branches: ["physics/**", "main"]
    paths:
      - "candidates/phase1-regulated-kms-bkm-v2/**"
      - ".github/workflows/phase1-regulated-kms-bkm-v2.yml"
  pull_request:
    paths:
      - "candidates/phase1-regulated-kms-bkm-v2/**"
      - ".github/workflows/phase1-regulated-kms-bkm-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/phase1-regulated-kms-bkm-v2/requirements.txt
          ruff==0.16.3
      - name: Lint
        run: >-
          ruff check
          candidates/phase1-regulated-kms-bkm-v2/harness.py
          candidates/phase1-regulated-kms-bkm-v2/independent_bkm_oracle.py
          candidates/phase1-regulated-kms-bkm-v2/test_harness.py
          candidates/phase1-regulated-kms-bkm-v2/test_independent_bkm_oracle.py
      - name: Run strict falsification gates
        run: >-
          python candidates/phase1-regulated-kms-bkm-v2/harness.py
          --strict
          --output phase1-regulated-kms-bkm-${{ matrix.python-version }}.json
      - name: Run independent BKM oracle
        run: >-
          python candidates/phase1-regulated-kms-bkm-v2/independent_bkm_oracle.py
          > phase1-independent-bkm-oracle-${{ matrix.python-version }}.json
      - name: Run regression tests
        run: >-
          python -m unittest discover
          -s candidates/phase1-regulated-kms-bkm-v2
          -p 'test_*.py'
          -v
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-regulated-kms-bkm-${{ matrix.python-version }}
          path: |
            phase1-regulated-kms-bkm-${{ matrix.python-version }}.json
            phase1-independent-bkm-oracle-${{ matrix.python-version }}.json
          if-no-files-found: error
