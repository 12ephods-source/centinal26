name: FToE Protected-I Running EW Floor

on:
  pull_request:
    paths:
      - 'physics/ftoe/protected_I_running_ew_floor_v06.json'
      - 'scripts/ftoe_so10_protected_i_running_ew_floor_gate.py'
      - 'scripts/ftoe_so10_running_ew_gauge_floor_gate.py'
      - 'scripts/ftoe_so10_422_gate.py'
      - 'tests/test_ftoe_so10_protected_i_running_ew_floor_gate.py'
      - '.github/workflows/ftoe-protected-i-running-ew-floor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  running-ew-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive RG-improved electroweak floor
        run: |
          mkdir -p artifacts/ftoe-protected-i-running-ew-floor
          python scripts/ftoe_so10_protected_i_running_ew_floor_gate.py \
            --json artifacts/ftoe-protected-i-running-ew-floor/running_ew_floor_gate.json
      - name: Run focused tests
        run: python -m unittest tests.test_ftoe_so10_protected_i_running_ew_floor_gate -v
      - name: Record environment
        run: |
          python --version > artifacts/ftoe-protected-i-running-ew-floor/environment.txt
          uname -a >> artifacts/ftoe-protected-i-running-ew-floor/environment.txt
      - name: Hash evidence
        run: |
          sha256sum \
            physics/ftoe/protected_I_running_ew_floor_v06.json \
            scripts/ftoe_so10_protected_i_running_ew_floor_gate.py \
            scripts/ftoe_so10_running_ew_gauge_floor_gate.py \
            scripts/ftoe_so10_422_gate.py \
            tests/test_ftoe_so10_protected_i_running_ew_floor_gate.py \
            artifacts/ftoe-protected-i-running-ew-floor/running_ew_floor_gate.json \
            artifacts/ftoe-protected-i-running-ew-floor/environment.txt \
            > artifacts/ftoe-protected-i-running-ew-floor/sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftoe-protected-i-running-ew-floor-evidence
          path: artifacts/ftoe-protected-i-running-ew-floor/
