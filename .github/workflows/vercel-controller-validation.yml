name: Vercel Controller Validation

on:
  pull_request:
    paths:
      - "automation/deployment/vercel_controller/**"
      - "automation/device/outbound_worker.py"
      - "tests/test_outbound_worker_transport_auth.py"
      - ".github/workflows/vercel-controller-validation.yml"
  push:
    branches: [main]
    paths:
      - "automation/deployment/vercel_controller/**"
      - "automation/device/outbound_worker.py"
      - "tests/test_outbound_worker_transport_auth.py"
      - ".github/workflows/vercel-controller-validation.yml"

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install controller dependencies
        working-directory: automation/deployment/vercel_controller
        run: npm install --ignore-scripts
      - name: Run controller unit tests
        working-directory: automation/deployment/vercel_controller
        run: npm test
      - name: Syntax-check Vercel functions
        working-directory: automation/deployment/vercel_controller
        run: |
          find api lib -name '*.js' -print0 | xargs -0 -n1 node --check
