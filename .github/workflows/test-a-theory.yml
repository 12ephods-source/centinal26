name: Test-a-Theory MVP

on:
  pull_request:
    paths:
      - 'src/centinal26/test_a_theory.py'
      - 'scripts/test_a_theory.py'
      - 'scripts/validate_test_a_theory_heldout.py'
      - 'tests/test_test_a_theory.py'
      - 'validation/test_a_theory/**'
      - '.github/workflows/test-a-theory.yml'
  push:
    branches: [main]
    paths:
      - 'src/centinal26/test_a_theory.py'
      - 'scripts/test_a_theory.py'
      - 'scripts/validate_test_a_theory_heldout.py'
      - 'tests/test_test_a_theory.py'
      - 'validation/test_a_theory/**'
      - '.github/workflows/test-a-theory.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Focused unit gates
        run: python -m pytest -q tests/test_test_a_theory.py
      - name: Predeclared host-heldout fixtures
        run: python scripts/validate_test_a_theory_heldout.py
