name: geometric-reasoning

on:
  pull_request:
    paths:
      - "experiments/geometric_reasoning/**"
      - ".github/workflows/geometric-reasoning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsification-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip numpy torch

      - name: Record environment
        run: |
          python --version | tee experiments/geometric_reasoning/environment.txt
          python - <<'PY' | tee -a experiments/geometric_reasoning/environment.txt
          import numpy, torch
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          PY
          python -m pip freeze >> experiments/geometric_reasoning/environment.txt

      - name: Run five-seed matched experiment
        run: |
          python experiments/geometric_reasoning/geometric_reasoning_falsification.py \
            --steps 700 \
            --seeds 5 \
            --out experiments/geometric_reasoning/ci_results.json \
            | tee experiments/geometric_reasoning/ci_stdout.log

      - name: Apply preregistered result checks
        run: |
          python experiments/geometric_reasoning/check_results.py \
            experiments/geometric_reasoning/ci_results.json \
            | tee experiments/geometric_reasoning/ci_verdict.json

      - name: Hash evidence
        run: |
          sha256sum \
            experiments/geometric_reasoning/geometric_reasoning_falsification.py \
            experiments/geometric_reasoning/check_results.py \
            experiments/geometric_reasoning/ci_results.json \
            experiments/geometric_reasoning/ci_verdict.json \
            experiments/geometric_reasoning/environment.txt \
            > experiments/geometric_reasoning/ci_sha256.txt
          cat experiments/geometric_reasoning/ci_sha256.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometric-reasoning-evidence
          path: |
            experiments/geometric_reasoning/ci_results.json
            experiments/geometric_reasoning/ci_stdout.log
            experiments/geometric_reasoning/ci_verdict.json
            experiments/geometric_reasoning/environment.txt
            experiments/geometric_reasoning/ci_sha256.txt
