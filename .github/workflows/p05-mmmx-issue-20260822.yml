name: P05 MMMX 2026-08-22 Issuance Evidence

on:
  pull_request:
    paths:
      - 'scripts/p05_mmmx_issue_evidence.py'
      - '.github/workflows/p05-mmmx-issue-20260822.yml'
      - 'src/frost_core/p05_prospective.py'

permissions:
  contents: read

jobs:
  issue-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert literal exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Acquire frozen sources and compute issuance evidence
        run: python scripts/p05_mmmx_issue_evidence.py
      - name: Capture environment
        shell: bash
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            date -u +"acquisition_finished_utc=%Y-%m-%dT%H:%M:%SZ"
            cat /etc/os-release
          } > artifacts/p05-mmmx-20260822/environment.txt
          sha256sum artifacts/p05-mmmx-20260822/environment.txt >> artifacts/p05-mmmx-20260822/SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p05-mmmx-20260822-issuance-evidence
          path: artifacts/p05-mmmx-20260822
