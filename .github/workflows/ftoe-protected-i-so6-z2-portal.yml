name: FToE Protected-I SO6 Z2 Portal Gate

on:
  pull_request:
    paths:
      - 'research/ftoe/protected_i_so6_z2_portal_contract.json'
      - 'scripts/ftoe_protected_i_so6_z2_portal_gate.py'
      - 'tests/test_ftoe_protected_i_so6_z2_portal_gate.py'
      - '.github/workflows/ftoe-protected-i-so6-z2-portal.yml'

jobs:
  z2-portal-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert literal exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "expected_head=$expected"
          echo "actual_head=$actual"
          test "$actual" = "$expected"
      - name: Run deterministic scientific gate
        run: python scripts/ftoe_protected_i_so6_z2_portal_gate.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_ftoe_protected_i_so6_z2_portal_gate.py
      - name: Capture environment and hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ftoe-protected-i-so6-z2-portal-evidence
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            echo "git=$(git --version)"
            cat /etc/os-release
          } > artifacts/ftoe-protected-i-so6-z2-portal-evidence/environment.txt
          cp research/ftoe/protected_i_so6_z2_portal_contract.json artifacts/ftoe-protected-i-so6-z2-portal-evidence/
          cp artifacts/ftoe_protected_i_so6_z2_portal_gate.json artifacts/ftoe-protected-i-so6-z2-portal-evidence/
          sha256sum \
            research/ftoe/protected_i_so6_z2_portal_contract.json \
            scripts/ftoe_protected_i_so6_z2_portal_gate.py \
            tests/test_ftoe_protected_i_so6_z2_portal_gate.py \
            artifacts/ftoe_protected_i_so6_z2_portal_gate.json \
            > artifacts/ftoe-protected-i-so6-z2-portal-evidence/SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ftoe-protected-i-so6-z2-portal-evidence
          path: artifacts/ftoe-protected-i-so6-z2-portal-evidence
