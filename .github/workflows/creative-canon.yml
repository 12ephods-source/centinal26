name: Creative Canon Engine

on:
  pull_request:
    paths:
      - 'src/centinal26/creative_canon.py'
      - 'tests/test_creative_canon.py'
      - 'automation/creative_canon/**'
      - '.github/workflows/creative-canon.yml'
  push:
    branches: [main]
    paths:
      - 'src/centinal26/creative_canon.py'
      - 'tests/test_creative_canon.py'
      - 'automation/creative_canon/**'
      - '.github/workflows/creative-canon.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_creative_canon.py
