name: Bounded multi-mode finite Type-I cocycle regulator

on:
  push:
    branches: ["agent/multi-mode-cocycle-regulator-v1"]
    paths:
      - "candidates/multi-mode-cocycle-regulator/**"
      - ".github/workflows/multi-mode-cocycle-regulator.yml"
  pull_request:
    paths:
      - "candidates/multi-mode-cocycle-regulator/**"
      - ".github/workflows/multi-mode-cocycle-regulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-multi-mode-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout literal scientific head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout provenance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/multi-mode-cocycle-regulator/requirements.txt
          ruff==0.16.3

      - name: Lint candidate
        id: lint
        continue-on-error: true
        run: >-
          ruff check
          candidates/multi-mode-cocycle-regulator/multi_mode_scan.py
          candidates/multi-mode-cocycle-regulator/test_multi_mode_scan.py

      - name: Generate frozen evidence
        id: scan
        continue-on-error: true
        run: >-
          python candidates/multi-mode-cocycle-regulator/multi_mode_scan.py
          --output multi-mode-python-${{ matrix.python-version }}.json

      - name: Apply frozen scientific checker
        id: strict
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("multi-mode-python-${{ matrix.python-version }}.json")
          payload = json.loads(path.read_text())
          summary = payload["validation_summary"]
          print(json.dumps(summary, indent=2, sort_keys=True))
          raise SystemExit(0 if summary["overall_status"] == "PASS_BOUNDED_MULTI_MODE_REGULATOR_STRESS" else 1)
          PY

      - name: Regression tests
        id: tests
        continue-on-error: true
        run: >-
          python -m unittest discover
          -s candidates/multi-mode-cocycle-regulator
          -p 'test_*.py'
          -v

      - name: Capture environment and exact source identity
        if: always()
        shell: bash
        run: |
          {
            echo "git_head=$(git rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import numpy, platform
          print(f"numpy={numpy.__version__}")
          print(f"platform={platform.platform()}")
          PY
          } > multi-mode-environment-${{ matrix.python-version }}.txt
          sha256sum \
            candidates/multi-mode-cocycle-regulator/multi_mode_scan.py \
            candidates/multi-mode-cocycle-regulator/test_multi_mode_scan.py \
            candidates/multi-mode-cocycle-regulator/README.md \
            .github/workflows/multi-mode-cocycle-regulator.yml \
            multi-mode-python-${{ matrix.python-version }}.json \
            multi-mode-environment-${{ matrix.python-version }}.txt \
            > multi-mode-sha256-${{ matrix.python-version }}.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-mode-cocycle-regulator-python-${{ matrix.python-version }}
          path: |
            multi-mode-python-${{ matrix.python-version }}.json
            multi-mode-environment-${{ matrix.python-version }}.txt
            multi-mode-sha256-${{ matrix.python-version }}.txt
          if-no-files-found: warn

      - name: Enforce fail-closed outcome
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.strict.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
