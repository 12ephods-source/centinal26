name: Project Goal Reconciler

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile-project-goals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run reconciler regression tests
        run: python -m pytest -q tests/test_project_goal_reconciler.py
      - name: Reconcile live open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python automation/federation/project_goal_reconciler.py --repo "${{ github.repository }}" > project_goal_reconciliation.json
      - name: Validate reconciliation output
        run: |
          python - <<'PY'
          import json
          p=json.load(open('project_goal_reconciliation.json'))
          assert p['schema_version'] == 1
          assert p['actionable_count'] >= 0
          assert p['blocked_count'] >= 0
          print(json.dumps(p, indent=2))
          PY
