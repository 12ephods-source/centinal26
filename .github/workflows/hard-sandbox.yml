name: hard-sandbox

on:
  pull_request:
    paths:
      - "src/centinal26/hard_sandbox.py"
      - "tests/test_hard_sandbox.py"
      - ".github/workflows/hard-sandbox.yml"
  push:
    branches: ["main"]
    paths:
      - "src/centinal26/hard_sandbox.py"
      - "tests/test_hard_sandbox.py"
      - ".github/workflows/hard-sandbox.yml"

permissions:
  contents: read

jobs:
  executable-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CENTINAL26_HARD_SANDBOX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and sandbox backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Verify user namespace availability
        run: |
          test "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo 1)" = "1"
          bwrap --version
      - name: Run executable isolation contract
        run: pytest -q tests/test_hard_sandbox.py
