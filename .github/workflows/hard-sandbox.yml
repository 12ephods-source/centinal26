name: hard-sandbox

on:
  pull_request:
    paths:
      - "src/centinal26/hard_sandbox.py"
      - "tests/test_hard_sandbox.py"
      - ".github/workflows/hard-sandbox.yml"
  push:
    branches: ["main"]
    paths:
      - "src/centinal26/hard_sandbox.py"
      - "tests/test_hard_sandbox.py"
      - ".github/workflows/hard-sandbox.yml"

permissions:
  contents: read

jobs:
  executable-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CENTINAL26_HARD_SANDBOX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and sandbox backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Verify sandbox backend is installed
        run: bwrap --version
      - name: Run executable isolation contract
        # GitHub-hosted runners restrict unprivileged network namespace setup.
        # sudo is used only to establish Bubblewrap's namespace boundary; the
        # actual payload executes inside the evaluator's cleared, read-only,
        # network-isolated sandbox and is still subject to its resource limits.
        run: sudo --preserve-env=CENTINAL26_HARD_SANDBOX_REQUIRED "$(which python)" -m pytest -q tests/test_hard_sandbox.py
