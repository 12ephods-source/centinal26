name: geometric-symbolic-v3

on:
  pull_request:
    paths:
      - "experiments/geometric_symbolic_v3/**"
      - ".github/workflows/geometric-symbolic-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-seed-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy torch
      - name: Run exact v2 mechanism on fresh seeds
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v3/run_fresh_seeds.py \
            --steps 500 \
            --seeds 3 \
            --seed-start 101 \
            --out experiments/geometric_symbolic_v3/ci_results.json \
            | tee experiments/geometric_symbolic_v3/ci_stdout.log
      - name: Apply preregistered v3 checker
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v3/check_results.py \
            experiments/geometric_symbolic_v3/ci_results.json \
            | tee experiments/geometric_symbolic_v3/ci_verdict.json
      - name: Hash evidence
        if: always()
        run: |
          sha256sum \
            experiments/geometric_symbolic_v2/geometric_symbolic_v2.py \
            experiments/geometric_symbolic_v3/run_fresh_seeds.py \
            experiments/geometric_symbolic_v3/check_results.py \
            experiments/geometric_symbolic_v3/ci_results.json \
            experiments/geometric_symbolic_v3/ci_verdict.json \
            > experiments/geometric_symbolic_v3/ci_sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometric-symbolic-v3-evidence
          path: |
            experiments/geometric_symbolic_v3/ci_results.json
            experiments/geometric_symbolic_v3/ci_stdout.log
            experiments/geometric_symbolic_v3/ci_verdict.json
            experiments/geometric_symbolic_v3/ci_sha256.txt
