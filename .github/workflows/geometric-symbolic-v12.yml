name: geometric-symbolic-v12

on:
  pull_request:
    paths:
      - 'experiments/geometric_symbolic_v11/**'
      - 'experiments/geometric_symbolic_v12/**'
      - '.github/workflows/geometric-symbolic-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-dose-anchor-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy torch
      - name: Run frozen v12 experiment
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v12/geometric_symbolic_v12.py --steps 700 --out experiments/geometric_symbolic_v12/ci_results.json | tee experiments/geometric_symbolic_v12/ci_stdout.log
      - name: Apply frozen v12 checker
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v12/check_results.py experiments/geometric_symbolic_v12/ci_results.json | tee experiments/geometric_symbolic_v12/ci_verdict.json
      - name: Record environment
        if: always()
        run: |
          python --version > experiments/geometric_symbolic_v12/ci_environment.txt 2>&1
          python - <<'PY' >> experiments/geometric_symbolic_v12/ci_environment.txt 2>&1
          import numpy, torch
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          PY
      - name: Hash evidence
        if: always()
        run: |
          sha256sum experiments/geometric_symbolic_v12/geometric_symbolic_v12.py experiments/geometric_symbolic_v12/check_results.py experiments/geometric_symbolic_v12/ci_results.json experiments/geometric_symbolic_v12/ci_verdict.json experiments/geometric_symbolic_v12/ci_environment.txt > experiments/geometric_symbolic_v12/ci_sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometric-symbolic-v12-evidence
          path: |
            experiments/geometric_symbolic_v12/ci_results.json
            experiments/geometric_symbolic_v12/ci_stdout.log
            experiments/geometric_symbolic_v12/ci_verdict.json
            experiments/geometric_symbolic_v12/ci_environment.txt
            experiments/geometric_symbolic_v12/ci_sha256.txt
