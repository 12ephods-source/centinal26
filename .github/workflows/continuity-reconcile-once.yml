name: continuity-reconcile-once

on:
  push:
    branches:
      - agent/continuity-hardening-reconcile-v1

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/continuity-hardening-reconcile-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Reconcile canonical continuity state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          QUALIFIED_HEAD = "3838b20ce9cbddb9ee5d73432726248dd88398e5"
          PRODUCTION_MERGE = "8c07f2f89de638f5d2b4e464250b7cf838d5f070"
          BRIDGE_MERGE = "5a7118447b003c6e6a5547f4b659cc454f06ec8e"

          authority_path = Path("automation/SECOND_BRAIN_AUTHORITY.json")
          authority = json.loads(authority_path.read_text(encoding="utf-8"))
          authority["version"] = "1.2.0"
          authority["status"] = "HOST_VERIFIED_EXTERNAL_GATES_PENDING"
          authority["source_commit"] = PRODUCTION_MERGE

          by_rank = {item["rank"]: item for item in authority["roadmap_overlap"]}
          updates = {
              10: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "Existing Frost CORE content-addressed storage remains canonical; no duplicate store was created.",
              ),
              11: (
                  "PARTIAL",
                  "HARDEN",
                  "Fail-closed age delegation and non-destructive rotation planning are host-qualified; real age encryption, off-device replication, retrieval, and recovery remain externally unobserved.",
              ),
              12: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "Deterministic portable continuity bundles with externally selected Ed25519 verification are host-qualified and canonical.",
              ),
              13: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "Atomic compare-and-swap canonical alias updates are host-qualified and prevent lost knowledge-head updates.",
              ),
              14: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "Typed relationship verification is host-qualified in the canonical object store and proposal boundary.",
              ),
              15: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "The versioned continuity proposal JSON contract is now part of canonical Centinal26 schema governance.",
              ),
              16: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "Deterministic fail-closed manifest semantics for filesystem indirections, permissions, sparse files, and resource limits are host-qualified.",
              ),
              17: (
                  "PARTIAL",
                  "HARDEN",
                  "Non-destructive integrity and orphan diagnostics are host-qualified; destructive garbage collection remains explicitly unauthorized.",
              ),
              18: (
                  "CANONICAL_ALREADY",
                  "REUSE",
                  "The continuity JSON contract and human reference are deterministically generated from one governed schema source.",
              ),
          }
          for rank, (classification, action, rationale) in updates.items():
              item = by_rank[rank]
              item["classification"] = classification
              item["action"] = action
              item["rationale"] = rationale

          authority["verification"] = {
              "second_brain_v02_bridge_merge": BRIDGE_MERGE,
              "continuity_hardening_pr": 268,
              "continuity_hardening_exact_head": QUALIFIED_HEAD,
              "continuity_hardening_production_merge": PRODUCTION_MERGE,
              "ci": "PASS",
              "automation_validation": "PASS",
              "validate": "PASS",
              "automation_gates": "PASS",
              "federation_gates": "PASS",
              "mature_product_qualification": "PASS",
              "python_matrix": ["3.11", "3.12", "3.13"],
          }
          authority["external_boundaries"] = {
              "real_age_encryption": "NOT_OBSERVED",
              "off_device_replication_and_restore": "NOT_OBSERVED",
              "android_termux_device_validation": {
                  "status": "PENDING_PHYSICAL",
                  "tracker_issue": 208,
              },
              "reboot_persistence": {
                  "status": "PENDING_PHYSICAL",
                  "tracker_issue": 208,
              },
          }
          authority["promotion_gate"]["current_status"] = (
              "HOST_INTEGRATION_VERIFIED_EXTERNAL_AND_PHYSICAL_GATES_PENDING"
          )
          authority_path.write_text(json.dumps(authority, indent=2) + "\n", encoding="utf-8")

          blockers_path = Path("automation/DEFERRED_BLOCKERS.json")
          blockers = json.loads(blockers_path.read_text(encoding="utf-8"))
          blocker = {
              "id": "continuity_age_off_device_recovery",
              "status": "DEFERRED_BLOCKED",
              "blocker_class": ["PLATFORM_BOUNDARY", "EXTERNAL_PROVISIONING"],
              "evidence": {
                  "software_merge": "PR #268",
                  "exact_head": QUALIFIED_HEAD,
                  "production_commit": PRODUCTION_MERGE,
                  "host_contract_validation": "PASS",
                  "real_age_end_to_end_evidence": "NOT_OBSERVED",
                  "off_device_replication_evidence": "NOT_OBSERVED",
              },
              "resume_condition": (
                  "A real age provider and valid recipient are available; ciphertext is independently verified, replicated to an independently identified off-device target, retrieved, re-hashed, decrypted, and recovery-verified."
              ),
              "promotion_boundary": (
                  "Fake-provider tests, local ciphertext, or host CI do not establish off-device disaster recovery."
              ),
          }
          existing = {item["id"]: item for item in blockers["items"]}
          if blocker["id"] in existing:
              blockers["items"] = [
                  blocker if item["id"] == blocker["id"] else item
                  for item in blockers["items"]
              ]
          else:
              blockers["items"].append(blocker)
          blockers_path.write_text(json.dumps(blockers, indent=2) + "\n", encoding="utf-8")

          registry_path = Path("automation/abilities/registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          ability = {
              "id": "continuity/canonical-host-hardening-v1",
              "name": "Canonical continuity host hardening",
              "kind": "continuity-governance",
              "source": {
                  "lineage_pr": 268,
                  "exact_head": QUALIFIED_HEAD,
                  "production_commit": PRODUCTION_MERGE,
                  "second_brain_bridge_production_commit": BRIDGE_MERGE,
                  "paths": [
                      "src/frost_core/object_store.py",
                      "src/frost_core/continuity_proposal.py",
                      "src/frost_core/second_brain_context.py",
                      "src/frost_core/continuity_bundle.py",
                      "src/frost_core/encrypted_backup.py",
                      "src/frost_core/manifest_policy.py",
                      "src/frost_core/continuity_schema.py",
                      "automation/continuity_schema_source.json",
                      "schemas/continuity_migration_proposal.schema.json",
                  ],
              },
              "interface": {
                  "second_brain_normalize": "frost_core.second_brain_context.normalize_second_brain_v02_context",
                  "second_brain_ingest": "frost_core.second_brain_context.SecondBrainContextAdapter.ingest",
                  "proposal_ingest": "frost_core.continuity_proposal.ContinuityProposalAdapter.ingest",
                  "point_if_current": "frost_core.object_store.CanonicalObjectStore.point_if_current",
                  "typed_link": "frost_core.object_store.CanonicalObjectStore.link_typed",
                  "integrity_report": "frost_core.object_store.CanonicalObjectStore.integrity_report",
                  "create_signed_bundle": "frost_core.continuity_bundle.create_signed_bundle",
                  "verify_signed_bundle": "frost_core.continuity_bundle.verify_signed_bundle",
                  "encrypt_backup": "frost_core.encrypted_backup.encrypt_backup",
                  "rotation_plan": "frost_core.encrypted_backup.rotation_plan",
                  "build_manifest": "frost_core.manifest_policy.build_manifest",
                  "write_generated_schema": "frost_core.continuity_schema.write_generated",
              },
              "verification": {
                  "exact_head": QUALIFIED_HEAD,
                  "production_commit": PRODUCTION_MERGE,
                  "ci": "PASS",
                  "automation_validation": "PASS",
                  "validate": "PASS",
                  "automation_gates": "PASS",
                  "federation_gates": "PASS",
                  "mature_product_qualification": "PASS",
                  "python_matrix": ["3.11", "3.12", "3.13"],
                  "tests": [
                      "tests/test_second_brain_context.py",
                      "tests/test_continuity_proposal.py",
                      "tests/test_continuity_bundle.py",
                      "tests/test_encrypted_backup.py",
                      "tests/test_manifest_policy.py",
                      "tests/test_object_store_hardening.py",
                      "tests/test_continuity_schema.py",
                  ],
                  "real_age_provider": "PENDING_EXTERNAL_PROVIDER",
                  "off_device_replication": "PENDING_EXTERNAL_PROVISIONING",
                  "physical_device_execution": "NOT_CLAIMED",
              },
              "provenance": {
                  "origin": "canonical authority/adapter/Second-Brain bridge/hardening convergence across PRs #264, #265, #267, and #268",
                  "authority_boundary": (
                      "proposal-only continuity governance; no execution authority, automatic truth promotion, destructive garbage collection, or physical-device promotion"
                  ),
              },
              "lifecycle": {
                  "removal": (
                      "mark SUPERSEDED in a versioned successor registry entry before removing implementation references; retain immutable provenance and historical objects"
                  )
              },
              "status": "VERIFIED",
          }
          abilities = [item for item in registry["abilities"] if item.get("id") != ability["id"]]
          abilities.append(ability)
          registry["abilities"] = sorted(abilities, key=lambda item: item["id"])
          registry_path.write_text(
              json.dumps(registry, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          tests = '''from __future__ import annotations

import json
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
AUTHORITY_PATH = ROOT / "automation" / "SECOND_BRAIN_AUTHORITY.json"
PROJECT_STATE_PATH = ROOT / "automation" / "PROJECT_STATE.json"
BLOCKERS_PATH = ROOT / "automation" / "DEFERRED_BLOCKERS.json"

ALLOWED_CLASSIFICATIONS = {"CANONICAL_ALREADY", "PARTIAL", "NEW_REQUIRED"}
ALLOWED_ACTIONS = {
    "REUSE",
    "BUILD_AFTER_INTEGRATION",
    "EXTEND_EXISTING_EXPORTS",
    "HARDEN",
    "EXTEND",
}
EXPECTED_RANKS = set(range(10, 19))
CANONICAL_CONTINUITY_OWNER = "Centinal26 canonical continuity layer"
QUALIFIED_HEAD = "3838b20ce9cbddb9ee5d73432726248dd88398e5"
PRODUCTION_MERGE = "8c07f2f89de638f5d2b4e464250b7cf838d5f070"


def load_authority() -> dict:
    return json.loads(AUTHORITY_PATH.read_text(encoding="utf-8"))


def load_project_state() -> dict:
    return json.loads(PROJECT_STATE_PATH.read_text(encoding="utf-8"))


def load_blockers() -> dict:
    return json.loads(BLOCKERS_PATH.read_text(encoding="utf-8"))


def test_authority_map_is_well_formed() -> None:
    data = load_authority()
    assert data["schema"] == "frost.automation.second_brain_authority.v1"
    assert data["version"] == "1.2.0"
    assert data["status"] == "HOST_VERIFIED_EXTERNAL_GATES_PENDING"
    assert data["source_commit"] == PRODUCTION_MERGE
    assert data["authorities"]["repository_and_release_governance"] == "centinal26/main"
    assert data["authorities"]["second_brain_role"].startswith("domain semantics")


def test_machine_continuation_authority_matches_existing_canonical_state() -> None:
    authority = load_authority()
    project_state = load_project_state()
    expected = project_state["source_of_truth"]["machine_continuation"]
    assert expected == "automation/PROJECT_STATE.json"
    assert authority["authorities"]["machine_project_continuation"] == expected


def test_aiccep_is_migration_lineage_not_parallel_live_database_authority() -> None:
    data = load_authority()
    assert "migration/provenance" in data["authorities"]["aiccep_role"]
    assert "not a live canonical database authority" in data["authorities"]["aiccep_role"]
    forbidden = set(data["adapter_contract"]["forbidden"])
    assert "parallel_aiccep_canonical_database_authority" in forbidden
    assert "silent_aiccep_database_rewrite" in forbidden


def test_roadmap_10_through_18_have_unique_entries_and_owners() -> None:
    data = load_authority()
    items = data["roadmap_overlap"]
    ranks = [item["rank"] for item in items]
    assert set(ranks) == EXPECTED_RANKS
    assert len(ranks) == len(set(ranks))
    for item in items:
        assert item["classification"] in ALLOWED_CLASSIFICATIONS
        assert item["action"] in ALLOWED_ACTIONS
        assert item["canonical_owner"].strip()
        assert item["rationale"].strip()


def test_host_qualified_and_partial_roadmap_boundaries_are_explicit() -> None:
    data = load_authority()
    by_rank = {item["rank"]: item for item in data["roadmap_overlap"]}
    assert by_rank[10]["classification"] == "CANONICAL_ALREADY"
    for rank in (12, 13, 14, 15, 16, 18):
        assert by_rank[rank]["classification"] == "CANONICAL_ALREADY"
        assert by_rank[rank]["action"] == "REUSE"
    for rank in (11, 17):
        assert by_rank[rank]["classification"] == "PARTIAL"
        assert by_rank[rank]["action"] == "HARDEN"


def test_second_brain_is_not_a_parallel_runtime_authority() -> None:
    data = load_authority()
    authorities = data["authorities"]
    assert "independent canonical runtime" in authorities["second_brain_role"]
    forbidden = set(data["adapter_contract"]["forbidden"])
    assert "duplicate_artifact_byte_store" in forbidden
    assert "duplicate_execution_runtime" in forbidden


def test_knowledge_and_execution_task_authority_are_separate_without_split_state() -> None:
    data = load_authority()
    entities = data["entity_authority"]
    assert entities["knowledge_task"]["metadata_owner"] == CANONICAL_CONTINUITY_OWNER
    assert entities["execution_task"]["metadata_owner"] == "Centinal26/Frost CORE"
    assert entities["artifact"]["identity_and_bytes_owner"] == "Frost CORE"
    metadata_owners = {
        spec["metadata_owner"]
        for spec in entities.values()
        if "metadata_owner" in spec
        and spec["metadata_owner"] not in {"Git", "Centinal26/Frost CORE"}
    }
    assert metadata_owners == {CANONICAL_CONTINUITY_OWNER}


def test_adapter_is_proposal_only_and_idempotent() -> None:
    data = load_authority()
    contract = data["adapter_contract"]
    required = set(contract["required_properties"])
    assert contract["write_mode"] == "proposal_only"
    assert contract["canonical_target"] == CANONICAL_CONTINUITY_OWNER
    assert "idempotent_reingest" in required
    assert "artifact_hash_verification" in required
    assert "no_implicit_truth_promotion" in required
    assert "no_execution_authorization" in required


def test_exact_host_qualification_is_recorded() -> None:
    verification = load_authority()["verification"]
    assert verification["continuity_hardening_exact_head"] == QUALIFIED_HEAD
    assert verification["continuity_hardening_production_merge"] == PRODUCTION_MERGE
    for key in (
        "ci",
        "automation_validation",
        "validate",
        "automation_gates",
        "federation_gates",
        "mature_product_qualification",
    ):
        assert verification[key] == "PASS"
    assert verification["python_matrix"] == ["3.11", "3.12", "3.13"]


def test_external_and_physical_gates_remain_unpromoted() -> None:
    data = load_authority()
    boundaries = data["external_boundaries"]
    assert boundaries["real_age_encryption"] == "NOT_OBSERVED"
    assert boundaries["off_device_replication_and_restore"] == "NOT_OBSERVED"
    assert boundaries["android_termux_device_validation"] == {
        "status": "PENDING_PHYSICAL",
        "tracker_issue": 208,
    }
    assert boundaries["reboot_persistence"] == {
        "status": "PENDING_PHYSICAL",
        "tracker_issue": 208,
    }
    assert data["promotion_gate"]["current_status"] == (
        "HOST_INTEGRATION_VERIFIED_EXTERNAL_AND_PHYSICAL_GATES_PENDING"
    )


def test_age_off_device_boundary_is_deferred_not_promoted() -> None:
    items = {item["id"]: item for item in load_blockers()["items"]}
    blocker = items["continuity_age_off_device_recovery"]
    assert blocker["status"] == "DEFERRED_BLOCKED"
    assert blocker["evidence"]["host_contract_validation"] == "PASS"
    assert blocker["evidence"]["real_age_end_to_end_evidence"] == "NOT_OBSERVED"
    assert blocker["evidence"]["off_device_replication_evidence"] == "NOT_OBSERVED"
    assert "PR #268" == blocker["evidence"]["software_merge"]
'''
          Path("tests/test_second_brain_authority.py").write_text(tests, encoding="utf-8")

          docs = '''# AI-First Second Brain canonical authority map

Status: HOST_VERIFIED_EXTERNAL_GATES_PENDING

Machine-readable authority: `automation/SECOND_BRAIN_AUTHORITY.json`.

## Canonical decision

AI-First Second Brain v0.2.0 and historical AICCEP-OS remain migration, provenance, and domain-semantics sources. They are not parallel live canonical runtimes. `automation/PROJECT_STATE.json` remains the machine continuation authority; Centinal26/Frost CORE remain the bounded execution and artifact-identity path.

The historical AICCEP database must not be silently rewritten. Historical records enter through provenance-preserving, proposal-only adapters.

## Verified integration state

The authority map, generic proposal-only adapter, direct Second Brain v0.2 `export-context` bridge, and host continuity-hardening tranche are now integrated.

- The direct v0.2 bridge preserves complete source records, deterministic per-record hashes, epistemic state, relationships, and declared artifact hashes without granting execution or truth-promotion authority.
- Content-addressed storage remains reused rather than duplicated.
- Signed portable continuity bundles, optimistic compare-and-swap, typed relations, governed JSON schemas, hardened manifests, and single-source schema generation are host-qualified and canonical.
- Integrity/orphan reconciliation is deliberately non-destructive; garbage collection authority remains false.
- Encrypted-backup handling delegates to the external `age` provider and fails closed when that provider is unavailable. No plaintext fallback exists.

Exact continuity-hardening qualification was performed on head `3838b20ce9cbddb9ee5d73432726248dd88398e5`, then merged to production as `8c07f2f89de638f5d2b4e464250b7cf838d5f070`. CI, Automation Validation, validate, automation-gates, federation-gates, and Mature Product Qualification all passed; Ruff and pytest passed on Python 3.11, 3.12, and 3.13.

## Remaining partial boundaries

Roadmap rank 11 remains partial: the host delegation contract is verified, but real `age` encryption, independent off-device replication, retrieval, decryption, and recovery have not been observed.

Roadmap rank 17 remains partial: structural/orphan diagnostics are verified, but destructive garbage collection is not authorized.

Physical Android/Termux validation remains separate. Host or CI success cannot promote `DEVICE_VALIDATED` or `PERSISTENT_VALIDATED`; the canonical tracker remains issue #208.

## Current terminal boundary

No further architecture expansion is required by this integration plan. Resume this line only when one of the following external evidence conditions is available:

1. a real `age` provider plus an independently identified off-device target can complete encryption, replication, retrieval, re-hash, decryption, and recovery verification; or
2. device-origin evidence from the authorized Android/Termux physical gate in issue #208 is available, followed separately by reboot-persistence evidence.

Until then, the correct state is host integration verified with external and physical gates pending.
'''
          Path("docs/SECOND_BRAIN_CANONICAL_AUTHORITY.md").write_text(docs, encoding="utf-8")
          PY
      - name: Validate reconciled state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ability_registry.py validate
          python -m json.tool automation/SECOND_BRAIN_AUTHORITY.json >/dev/null
          python -m json.tool automation/DEFERRED_BLOCKERS.json >/dev/null
          ruff check tests/test_second_brain_authority.py
          pytest -q tests/test_second_brain_authority.py tests/test_ability_registry.py
          git diff --check
      - name: Commit reconciled state and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'frost-automation-bot'
          git config user.email 'frost-automation-bot@users.noreply.github.com'
          git add -- automation/SECOND_BRAIN_AUTHORITY.json
          git add -- automation/DEFERRED_BLOCKERS.json
          git add -- automation/abilities/registry.json
          git add -- docs/SECOND_BRAIN_CANONICAL_AUTHORITY.md
          git add -- tests/test_second_brain_authority.py
          git rm -- .github/workflows/continuity-reconcile-once.yml
          git diff --cached --check
          git commit -m 'Reconcile verified Second Brain continuity state'
          git push origin HEAD:agent/continuity-hardening-reconcile-v1
