name: Project Federation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate federation registry
        run: python automation/federation/project_federation.py
      - name: Run federation regression tests
        run: python -m pytest -q tests/test_project_federation.py
