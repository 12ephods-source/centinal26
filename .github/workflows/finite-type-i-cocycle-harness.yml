name: Finite Type-I cocycle harness

on:
  push:
    branches: ["agent/finite-type-i-cocycle"]
    paths:
      - "candidates/finite-type-i-cocycle-harness/**"
      - ".github/workflows/finite-type-i-cocycle-harness.yml"
  pull_request:
    paths:
      - "candidates/finite-type-i-cocycle-harness/**"
      - ".github/workflows/finite-type-i-cocycle-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/finite-type-i-cocycle-harness/requirements.txt
          ruff==0.16.3
      - name: Lint cocycle candidate
        run: >-
          ruff check
          candidates/finite-type-i-cocycle-harness/cocycle_scan.py
          candidates/finite-type-i-cocycle-harness/test_cocycle_scan.py
      - name: Run strict cocycle gate
        run: >-
          python candidates/finite-type-i-cocycle-harness/cocycle_scan.py
          --strict
          --output finite-type-i-cocycle-python-${{ matrix.python-version }}.json
      - name: Run regression tests
        run: >-
          python -m unittest discover
          -s candidates/finite-type-i-cocycle-harness
          -p 'test_*.py'
          -v
      - uses: actions/upload-artifact@v4
        with:
          name: finite-type-i-cocycle-python-${{ matrix.python-version }}
          path: finite-type-i-cocycle-python-${{ matrix.python-version }}.json
          if-no-files-found: error
