name: Finite Type-I cocycle harness

on:
  push:
    branches: ["main", "agent/**"]
    paths:
      - "candidates/finite-type-i-cocycle-harness/**"
      - ".github/workflows/finite-type-i-cocycle-harness.yml"
  pull_request:
    paths:
      - "candidates/finite-type-i-cocycle-harness/**"
      - ".github/workflows/finite-type-i-cocycle-harness.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/finite-type-i-cocycle-harness/requirements.txt
          ruff==0.16.3

      - name: Lint cocycle candidate
        id: lint
        continue-on-error: true
        run: >-
          ruff check
          candidates/finite-type-i-cocycle-harness/cocycle_scan.py
          candidates/finite-type-i-cocycle-harness/test_cocycle_scan.py
          candidates/finite-type-i-cocycle-harness/finite_type_i_cocycle.py
          candidates/finite-type-i-cocycle-harness/test_finite_type_i_cocycle.py

      - name: Generate integrated cocycle evidence
        id: scan
        continue-on-error: true
        run: >-
          python candidates/finite-type-i-cocycle-harness/cocycle_scan.py
          --strict
          --output finite-type-i-cocycle-python-${{ matrix.python-version }}.json

      - name: Run floor-free spectral-frame audit
        id: spectral
        continue-on-error: true
        run: >-
          python candidates/finite-type-i-cocycle-harness/finite_type_i_cocycle.py
          --strict
          --output finite-type-i-cocycle-spectral-python-${{ matrix.python-version }}.json

      - name: Run regression tests
        id: tests
        continue-on-error: true
        run: >-
          python -m unittest discover
          -s candidates/finite-type-i-cocycle-harness
          -p 'test_*.py'
          -v

      - name: Publish diagnostic summary to PR
        if: always() && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SPECTRAL_OUTCOME: ${{ steps.spectral.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          integrated = Path("finite-type-i-cocycle-python-3.12.json")
          spectral = Path("finite-type-i-cocycle-spectral-python-3.12.json")
          lines = [
              "## Finite Type-I cocycle CI diagnostic",
              "",
              f"- lint: `{os.environ['LINT_OUTCOME']}`",
              f"- integrated clock/cocycle gate: `{os.environ['SCAN_OUTCOME']}`",
              f"- floor-free spectral audit: `{os.environ['SPECTRAL_OUTCOME']}`",
              f"- regression tests: `{os.environ['TEST_OUTCOME']}`",
          ]
          if integrated.exists():
              payload = json.loads(integrated.read_text())
              lines.extend([
                  "",
                  f"Integrated overall: `{payload.get('validation_summary', {}).get('overall_status')}`",
              ])
          if spectral.exists():
              payload = json.loads(spectral.read_text())
              lines.extend([
                  f"Spectral overall: `{payload.get('status')}`",
                  f"Spectral gates: `{payload.get('gates', {}).get('passed')}/{payload.get('gates', {}).get('total')}`",
              ])
          Path("cocycle-ci-comment.md").write_text("\n".join(lines) + "\n")
          PY
          gh pr comment "$PR_NUMBER" --body-file cocycle-ci-comment.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-type-i-cocycle-python-${{ matrix.python-version }}
          path: |
            finite-type-i-cocycle-python-${{ matrix.python-version }}.json
            finite-type-i-cocycle-spectral-python-${{ matrix.python-version }}.json
          if-no-files-found: warn

      - name: Enforce fail-closed outcome
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.scan.outcome }}" = "success"
          test "${{ steps.spectral.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
