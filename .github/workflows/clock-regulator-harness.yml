name: Clock regulator harness

on:
  push:
    branches: ["main", "agent/**"]
    paths:
      - "candidates/clock-regulator-harness/**"
      - ".github/workflows/clock-regulator-harness.yml"
  pull_request:
    paths:
      - "candidates/clock-regulator-harness/**"
      - ".github/workflows/clock-regulator-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/clock-regulator-harness/requirements.txt
          ruff==0.16.3
      - name: Lint candidate
        run: >-
          ruff check
          candidates/clock-regulator-harness/clock_regulator_scan.py
          candidates/clock-regulator-harness/test_clock_regulator_scan.py
      - name: Run strict convergence gates
        run: >-
          python candidates/clock-regulator-harness/clock_regulator_scan.py
          --strict
          --output clock-regulator-python-${{ matrix.python-version }}.json
      - name: Run regression tests
        run: >-
          python -m unittest discover
          -s candidates/clock-regulator-harness
          -p 'test_*.py'
          -v
      - uses: actions/upload-artifact@v4
        with:
          name: clock-regulator-python-${{ matrix.python-version }}
          path: clock-regulator-python-${{ matrix.python-version }}.json
          if-no-files-found: error
