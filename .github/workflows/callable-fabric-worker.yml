name: Frost Callable Fabric Worker

on:
  push:
    branches: ["callable-runtime"]
    paths:
      - "runtime/requests/**"

permissions:
  contents: write

concurrency:
  group: frost-callable-fabric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute pending immutable semantic requests
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p runtime/results
          processed=0
          for req in runtime/requests/*.json; do
            base="$(basename "$req")"
            out="runtime/results/$base"
            if [[ -e "$out" ]]; then
              continue
            fi
            node deploy/github/callable-worker-v1.0.0/worker.js "$req" "$out"
            processed=1
          done
          echo "processed=$processed" >> "$GITHUB_OUTPUT"
      - name: Commit immutable results
        if: steps.worker.outputs.processed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "frost-callable-fabric[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record callable fabric result"
          git push origin HEAD:callable-runtime
