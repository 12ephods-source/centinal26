name: FToE Protected-I Littlest-Higgs Gate
on:
  pull_request:
    paths:
      - 'physics/ftoe/protected_I_littlest_higgs_candidate_v07.json'
      - 'scripts/ftoe_so10_protected_i_littlest_higgs_gate.py'
      - 'tests/test_ftoe_so10_protected_i_littlest_higgs_gate.py'
      - '.github/workflows/ftoe-protected-i-littlest-higgs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-mechanism-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Derive structural verdict
        run: |
          mkdir -p artifacts
          python scripts/ftoe_so10_protected_i_littlest_higgs_gate.py --candidate physics/ftoe/protected_I_littlest_higgs_candidate_v07.json --json artifacts/verdict.json
      - name: Focused tests
        run: python -m pytest -q tests/test_ftoe_so10_protected_i_littlest_higgs_gate.py
      - name: Hash evidence
        if: always()
        run: sha256sum physics/ftoe/protected_I_littlest_higgs_candidate_v07.json scripts/ftoe_so10_protected_i_littlest_higgs_gate.py tests/test_ftoe_so10_protected_i_littlest_higgs_gate.py artifacts/verdict.json > artifacts/sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftoe-protected-i-littlest-higgs-evidence
          path: artifacts/
