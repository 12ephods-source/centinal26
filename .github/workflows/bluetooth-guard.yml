name: Bluetooth Guard Android

on:
  pull_request:
    paths:
      - "android/bluetooth-guard/**"
      - ".github/workflows/bluetooth-guard.yml"
  push:
    branches: [main]
    paths:
      - "android/bluetooth-guard/**"
      - ".github/workflows/bluetooth-guard.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/bluetooth-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: frost-bluetooth-guard-debug-apk
          path: android/bluetooth-guard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
