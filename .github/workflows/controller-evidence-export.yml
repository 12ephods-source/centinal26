name: Controller Evidence Export

on:
  push:
    branches: ["main", "feature/controller-evidence-export-v1"]
    paths:
      - "automation/controller/base44_evidence_export.mjs"
      - "deploy/termux/FROST_EVIDENCE_GATE_ONE_PASTE_v1.0.sh"
      - "tests/test_controller_evidence_export.py"
      - ".github/workflows/controller-evidence-export.yml"
  pull_request:
    paths:
      - "automation/controller/base44_evidence_export.mjs"
      - "deploy/termux/FROST_EVIDENCE_GATE_ONE_PASTE_v1.0.sh"
      - "tests/test_controller_evidence_export.py"
      - ".github/workflows/controller-evidence-export.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check exporter syntax
        run: node --check automation/controller/base44_evidence_export.mjs
      - name: Run exporter offline self-test
        run: node automation/controller/base44_evidence_export.mjs --self-test
      - name: Check Termux installer shell syntax
        run: bash -n deploy/termux/FROST_EVIDENCE_GATE_ONE_PASTE_v1.0.sh
      - name: Reject Base44 write/service-role surfaces
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'base44(\.asServiceRole)?\.entities\.[A-Za-z0-9_]+\.(create|update|delete|bulkCreate|deleteMany)\(' automation/controller/base44_evidence_export.mjs
          ! grep -F 'asServiceRole' automation/controller/base44_evidence_export.mjs
