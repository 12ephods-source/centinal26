name: site-validate

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/validate_site.py'
      - '.github/workflows/site-validate.yml'
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'tests/validate_site.py'
      - '.github/workflows/site-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static site and release claims
        run: python tests/validate_site.py
