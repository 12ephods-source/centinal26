name: FToE Research Orchestrator

on:
  pull_request:
    paths:
      - 'scripts/ftoe_research_daemon.py'
      - 'termux/install_ftoe_research_daemon.sh'
      - 'physics/ftoe/llm_provider_registry.json'
      - 'physics/ftoe/publication_gate.json'
      - 'physics/ftoe/autonomous_research_state.json'
      - 'physics/ftoe/claim_ledger.json'
      - 'tests/test_ftoe_research_daemon.py'
      - '.github/workflows/ftoe-research-orchestrator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and state schemas
        run: |
          python -m py_compile scripts/ftoe_research_daemon.py tests/test_ftoe_research_daemon.py
          bash -n termux/install_ftoe_research_daemon.sh
          python -m json.tool physics/ftoe/llm_provider_registry.json >/dev/null
          python -m json.tool physics/ftoe/publication_gate.json >/dev/null
          python -m json.tool physics/ftoe/autonomous_research_state.json >/dev/null
          python -m json.tool physics/ftoe/claim_ledger.json >/dev/null
      - name: Unit tests without provider keys
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GEMINI_API_KEY: ''
          XAI_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          MISTRAL_API_KEY: ''
          COHERE_API_KEY: ''
        run: python -m unittest tests.test_ftoe_research_daemon -v
      - name: One-shot dry cycle
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GEMINI_API_KEY: ''
          XAI_API_KEY: ''
          DEEPSEEK_API_KEY: ''
          MISTRAL_API_KEY: ''
          COHERE_API_KEY: ''
        run: python scripts/ftoe_research_daemon.py --once
