name: OpenQuest Character Validator

on:
  pull_request:
    paths:
      - 'openquest/**'
      - '.github/workflows/openquest-character-validator.yml'
  push:
    branches: [main]
    paths:
      - 'openquest/**'
      - '.github/workflows/openquest-character-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run OpenQuest tests
        run: python -m unittest discover -s openquest/tests -v
      - name: Run deterministic demo export
        run: python -m openquest.validator > /tmp/openquest-character.json
      - name: Verify export is valid JSON
        run: python -m json.tool /tmp/openquest-character.json > /dev/null
      - name: Exercise CLI options contract
        run: python -m openquest.cli options > /tmp/openquest-options.json
      - name: Exercise CLI create-validate-export contract
        run: >-
          python -m openquest.cli create
          --name 'CI Hero'
          --class Fighter
          --species Human
          --background Soldier
          --skill athletics
          --skill perception
          --abilities '{"str":15,"dex":14,"con":13,"int":12,"wis":10,"cha":8}'
          --output /tmp/openquest-cli-character.json
          > /tmp/openquest-cli-stdout.json
      - name: Verify CLI outputs
        run: |
          python -m json.tool /tmp/openquest-options.json > /dev/null
          python -m json.tool /tmp/openquest-cli-character.json > /dev/null
          cmp /tmp/openquest-cli-character.json /tmp/openquest-cli-stdout.json
      - name: Exercise HTTP dispatch contract
        run: |
          python - <<'PY'
          import json
          from http import HTTPStatus
          from openquest.service import dispatch
          status, health = dispatch('GET', '/health')
          assert status == HTTPStatus.OK and health['status'] == 'PASS'
          request = {
              'name': 'HTTP CI Hero',
              'ability_scores': {'str':15,'dex':14,'con':13,'int':12,'wis':10,'cha':8},
              'class_name': 'Fighter',
              'species': 'Human',
              'background': 'Soldier',
              'skill_proficiencies': ['athletics', 'perception'],
          }
          status, payload = dispatch('POST', '/v1/characters', json.dumps(request).encode())
          assert status == HTTPStatus.CREATED
          assert payload['status'] == 'PASS'
          assert payload['result']['valid'] is True
          PY
