name: Agent Execution Plane

on:
  workflow_call:
    inputs:
      role:
        required: false
        type: string
      profile:
        required: false
        type: string
        default: agent-tests
  workflow_dispatch:
    inputs:
      role:
        required: true
        type: choice
        options: [planner, builder, judge, sre, sentinel]
      profile:
        required: true
        type: choice
        options: [agent-tests, full-tests, lint, fleet-qualify]
  push:
    branches: [main]
    paths:
      - src/centinal26/agent_execution_plane.py
      - tests/test_agent_execution_plane.py
      - .github/workflows/agent-execution.yml

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: agent-execution-${{ github.ref }}-${{ inputs.role || 'judge' }}-${{ inputs.profile || 'agent-tests' }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Centinal26
        run: python -m pip install -e ".[dev]"
      - name: Build bounded task
        env:
          ROLE: ${{ inputs.role }}
          PROFILE: ${{ inputs.profile }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os

          role = os.environ.get("ROLE") or "judge"
          profile = os.environ.get("PROFILE") or "agent-tests"
          profiles = {
              "agent-tests": ["python", "-m", "pytest", "-q", "tests/test_agent_execution_plane.py"],
              "full-tests": ["python", "-m", "pytest", "-q"],
              "lint": ["ruff", "check", "."],
              "fleet-qualify": ["python", "scripts/agent_fleet_qualify.py"],
          }
          if profile not in profiles:
              raise SystemExit(f"unsupported execution profile: {profile}")
          with open("agent_task.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "role": role,
                      "command": profiles[profile],
                      "timeout": 600,
                      "source_event": os.environ["EVENT_NAME"],
                      "profile": profile,
                  },
                  handle,
              )
          PY
      - name: Execute
        id: execute
        continue-on-error: true
        run: >-
          python -m centinal26.agent_execution_plane
          agent_task.json --evidence agent_evidence.json
      - name: Emit status record
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          task = json.loads(Path("agent_task.json").read_text())
          evidence_path = Path("agent_evidence.json")
          evidence = json.loads(evidence_path.read_text()) if evidence_path.exists() else {
              "status": "NO_EVIDENCE",
              "role": task.get("role"),
          }
          record = {
              "schema": "frost.agent_execution_status.v1",
              "role": task.get("role"),
              "profile": task.get("profile"),
              "source_event": task.get("source_event"),
              "result": evidence.get("status", "UNKNOWN"),
              "task_digest": evidence.get("task_digest"),
              "evidence_digest": evidence.get("evidence_digest"),
          }
          Path("agent_status.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evidence-${{ github.run_id }}
          path: |
            agent_task.json
            agent_evidence.json
            agent_status.json
          retention-days: 30
      - name: Update durable status ledger
        if: always()
        uses: actions/github-script@v7
        env:
          ROLE: ${{ inputs.role || 'judge' }}
          PROFILE: ${{ inputs.profile || 'agent-tests' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- frost-agent-execution-ledger-v1 -->';
            const status = JSON.parse(fs.readFileSync('agent_status.json', 'utf8'));
            const evidence = fs.existsSync('agent_evidence.json')
              ? JSON.parse(fs.readFileSync('agent_evidence.json', 'utf8'))
              : {};
            const title = 'Agent Execution Plane Status';
            const body = [
              marker,
              '# Agent Execution Plane Status',
              '',
              `- Run: ${context.runId}`,
              `- Commit: ${context.sha}`,
              `- Event: ${context.eventName}`,
              `- Role: ${status.role}`,
              `- Profile: ${status.profile}`,
              `- Result: ${status.result}`,
              `- Task digest: ${status.task_digest || 'n/a'}`,
              `- Evidence digest: ${status.evidence_digest || 'n/a'}`,
              '',
              'This issue is the durable human-readable status ledger. Machine-readable evidence is retained as a workflow artifact.',
              '',
              `Last stdout tail:\n\n\`\`\`\n${(evidence.stdout || '').slice(-3000)}\n\`\`\``,
              '',
              `Last stderr tail:\n\n\`\`\`\n${(evidence.stderr || '').slice(-3000)}\n\`\`\``,
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.body && issue.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Enforce execution result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("agent_evidence.json").read_text())
          if evidence.get("status") != "PASS":
              raise SystemExit(1)
          PY
