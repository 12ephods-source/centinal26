name: Frost Learning OS Android Emulator

on:
  pull_request:
    paths:
      - 'external/frost-learning-os/android-v1.4/**'
      - '.github/workflows/frost-learning-os-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build fixed APK
        working-directory: external/frost-learning-os/android-v1.4
        run: gradle --no-daemon :app:assembleDebug
      - name: Run emulator UI gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: cd external/frost-learning-os/android-v1.4 && python3 emulator_ui_gate.py
      - name: Hash emulator evidence
        if: always()
        working-directory: external/frost-learning-os/android-v1.4
        run: |
          mkdir -p emulator-evidence
          find emulator-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > emulator-evidence/SHA256SUMS.txt
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frost-learning-os-v1.4.1-emulator-evidence
          path: external/frost-learning-os/android-v1.4/emulator-evidence/
          if-no-files-found: error
