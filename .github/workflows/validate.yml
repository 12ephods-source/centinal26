name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository invariant and schemas
        run: python tests/validate_repository.py
      - name: Compile Python
        run: python -m compileall -q tests
