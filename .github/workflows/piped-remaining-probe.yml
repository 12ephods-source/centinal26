name: Piped remaining transcript probe

on:
  push:
    branches:
      - agent/youtube-transcriber-v1.3.0
    paths:
      - .github/workflows/piped-remaining-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_ID: tr9AqDYxFI4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe remaining documented Piped instances
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          vid = os.environ['VIDEO_ID']
          instances = [
              'https://pipedapi.nosebs.ru',
              'https://pipedapi.drgns.space',
              'https://pipedapi.owo.si',
              'https://pipedapi.ducks.party',
              'https://piped-api.codespace.cz',
              'https://pipedapi.reallyaweso.me',
              'https://pipedapi.darkness.services',
          ]
          attempts = []
          success = None

          def get(url, timeout=12):
              req = Request(url, headers={'User-Agent': 'Mozilla/5.0 transcript-validation/1.0'})
              with urlopen(req, timeout=timeout) as r:
                  return r.read(), r.headers.get_content_type()

          def to_text(raw, mime):
              s = raw.decode('utf-8', errors='replace').replace('\ufeff','')
              if 'xml' in mime or '<text' in s or '<p ' in s:
                  chunks = re.findall(r'<(?:text|p)\b[^>]*>(.*?)</(?:text|p)>', s, flags=re.I|re.S)
                  return '\n'.join(html.unescape(re.sub(r'<[^>]+>', '', x)).strip() for x in chunks if x.strip())
              lines=[]
              for line in s.splitlines():
                  x=line.strip()
                  if not x or x.upper()=='WEBVTT' or '-->' in x or re.fullmatch(r'\d+',x):
                      continue
                  if x.startswith(('Kind:','Language:','NOTE ')):
                      continue
                  x=html.unescape(re.sub(r'<[^>]+>','',x)).strip()
                  if x and (not lines or x != lines[-1]): lines.append(x)
              return '\n'.join(lines)

          for base in instances:
              try:
                  raw,_=get(f'{base}/streams/{vid}')
                  info=json.loads(raw)
                  subs=info.get('subtitles') or []
                  if not subs:
                      attempts.append({'instance':base,'result':'no_subtitles','title':info.get('title')})
                      continue
                  subs.sort(key=lambda s:(0 if str(s.get('code','')).lower().startswith('en') else 1,1 if s.get('autoGenerated') else 0))
                  for sub in subs:
                      if not sub.get('url'): continue
                      try:
                          sr,mime=get(sub['url'])
                          text=to_text(sr,mime or str(sub.get('mimeType') or ''))
                          if len(text.split()) < 20: continue
                          normalized=' '.join(text.split())
                          success={
                              'status':'PASS','video_id':vid,'instance':base,'title':info.get('title'),
                              'language_code':sub.get('code'),'is_generated':sub.get('autoGenerated'),
                              'characters':len(text),'words':len(text.split()),
                              'sha256':hashlib.sha256(text.encode()).hexdigest(),
                              'bounded_excerpt':normalized[:80],
                          }
                          break
                      except Exception as e:
                          attempts.append({'instance':base,'subtitle':str(sub.get('code')),'error':f'{type(e).__name__}: {e}'})
                  if success: break
              except Exception as e:
                  attempts.append({'instance':base,'error':f'{type(e).__name__}: {e}'})

          evidence = success or {'status':'BLOCKED','video_id':vid,'attempts':attempts}
          evidence['copyright_note']='Full transcript was not persisted or uploaded.'
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/PIPED_REMAINING.json').write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({k:evidence.get(k) for k in ('status','video_id','instance','title','characters','words','sha256')},indent=2))
          if evidence['status'] != 'PASS': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piped-remaining-probe
          path: evidence/PIPED_REMAINING.json
          if-no-files-found: error
          retention-days: 7
