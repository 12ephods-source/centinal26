name: continuity-ruff-probe

on:
  pull_request:
    paths:
      - 'tests/test_continuity_schema.py'
      - 'tests/test_encrypted_backup.py'
      - '.github/workflows/continuity-ruff-probe.yml'

permissions:
  contents: read

jobs:
  import-order:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.4'
      - name: Show canonical Ruff fix diff
        shell: bash
        run: |
          set +e
          ruff check --fix --diff tests/test_continuity_schema.py tests/test_encrypted_backup.py
          exit 0
