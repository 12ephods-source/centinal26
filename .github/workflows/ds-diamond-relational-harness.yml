name: dS diamond relational harness

on:
  push:
    branches: ["main", "agent/**"]
    paths:
      - "candidates/ds-diamond-relational-harness/**"
      - "candidates/clock-regulator-harness/**"
      - "candidates/kms-modular-cocycle-harness/**"
      - ".github/workflows/ds-diamond-relational-harness.yml"
  pull_request:
    paths:
      - "candidates/ds-diamond-relational-harness/**"
      - "candidates/clock-regulator-harness/**"
      - "candidates/kms-modular-cocycle-harness/**"
      - ".github/workflows/ds-diamond-relational-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r candidates/ds-diamond-relational-harness/requirements.txt
          ruff==0.16.3
      - name: Lint candidate
        run: >-
          ruff check
          --output-format=github
          candidates/ds-diamond-relational-harness/ds_diamond_relational_scan.py
          candidates/ds-diamond-relational-harness/test_ds_diamond_relational_scan.py
      - name: Run strict geometry/relational gates
        run: >-
          python candidates/ds-diamond-relational-harness/ds_diamond_relational_scan.py
          --strict
          --output ds-diamond-relational-python-${{ matrix.python-version }}.json
      - name: Run regression tests
        run: >-
          python -m unittest discover
          -s candidates/ds-diamond-relational-harness
          -p 'test_*.py'
          -v
      - uses: actions/upload-artifact@v4
        with:
          name: ds-diamond-relational-python-${{ matrix.python-version }}
          path: ds-diamond-relational-python-${{ matrix.python-version }}.json
          if-no-files-found: error
