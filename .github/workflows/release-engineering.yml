name: Release Engineering Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Static validation
        run: >-
          ruff check
          scripts/build_release_evidence.py
          scripts/run_host_chaos_qualification.py
          scripts/validate_release_engineering.py
          src/frost_core/continuity_bundle.py
          src/frost_core/sqlite_recovery.py
          tests/test_continuity_bundle.py
          tests/test_host_chaos_qualification.py
          tests/test_sqlite_recovery.py
          tests/test_release_evidence.py
      - name: Focused release/recovery tests
        run: >-
          pytest -q
          tests/test_continuity_bundle.py
          tests/test_host_chaos_qualification.py
          tests/test_sqlite_recovery.py
          tests/test_release_evidence.py
      - name: Build deterministic release evidence twice
        run: |
          python scripts/build_release_evidence.py --output /tmp/release-evidence-a.json
          python scripts/build_release_evidence.py --output /tmp/release-evidence-b.json
          cmp /tmp/release-evidence-a.json /tmp/release-evidence-b.json
      - name: Run deterministic host chaos twice
        run: |
          python scripts/run_host_chaos_qualification.py --output /tmp/host-chaos-a.json
          python scripts/run_host_chaos_qualification.py --output /tmp/host-chaos-b.json
          cmp /tmp/host-chaos-a.json /tmp/host-chaos-b.json
      - name: Validate release engineering contracts
        run: >-
          python scripts/validate_release_engineering.py
          --evidence /tmp/release-evidence-a.json
          --chaos /tmp/host-chaos-a.json
