name: Automation Validation

on:
  push:
    paths:
      - 'automation/**'
  pull_request:
    paths:
      - 'automation/**'

jobs:
  validate-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run automation validation
        run: |
          python automation/ci/automation_test_suite.py
