name: Release Convergence Gate

on:
  pull_request:
    paths:
      - "automation/PROJECT_STATE.json"
      - "releases/CURRENT_RELEASE_STATE.json"
      - "releases/RELEASE_CONTRACT.json"
      - "releases/AUTHORITY_MATRIX.json"
      - "scripts/validate_release_convergence.py"
      - ".github/workflows/release-convergence.yml"
  push:
    branches: [main]
    paths:
      - "automation/PROJECT_STATE.json"
      - "releases/CURRENT_RELEASE_STATE.json"
      - "releases/RELEASE_CONTRACT.json"
      - "releases/AUTHORITY_MATRIX.json"
      - "scripts/validate_release_convergence.py"
      - ".github/workflows/release-convergence.yml"

permissions:
  contents: read

jobs:
  validate-release-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical release and authority convergence
        run: python scripts/validate_release_convergence.py
