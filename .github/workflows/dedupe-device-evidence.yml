name: Dedupe Organizer Device Evidence

on:
  pull_request:
    paths:
      - "tools/dedupe-organizer/device-evidence/runs/**"
      - "tools/dedupe-organizer/device_autopilot.sh"
      - "tools/dedupe-organizer/verify_device_evidence.py"
      - "tools/dedupe-organizer/materialize.py"
      - "tools/dedupe-organizer/payload/**"
      - "tests/test_dedupe_device_evidence.py"
      - ".github/workflows/dedupe-device-evidence.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/dedupe-organizer/device-evidence/runs/**"
      - "tools/dedupe-organizer/device_autopilot.sh"
      - "tools/dedupe-organizer/verify_device_evidence.py"
      - "tools/dedupe-organizer/materialize.py"
      - "tools/dedupe-organizer/payload/**"
      - "tests/test_dedupe_device_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check tools/dedupe-organizer/verify_device_evidence.py tests/test_dedupe_device_evidence.py
      - run: pytest -q tests/test_dedupe_device_evidence.py
      - name: Qualify device autopilot against exact v2.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/dedupe-organizer/device_autopilot.sh
          python tools/dedupe-organizer/materialize.py
          runtime="tools/dedupe-organizer/generated/dedupe_organizer.py"
          python "$runtime" --help | tee /tmp/dedupe-help.txt
          for command in self-test doctor audit-verify daemon; do
            if ! grep -q -- "$command" /tmp/dedupe-help.txt; then
              echo "Missing required CLI command: $command"
              exit 1
            fi
          done
          python "$runtime" --root /tmp/dedupe-device-compat daemon --help | tee /tmp/daemon-help.txt
          if ! grep -q -- "--once" /tmp/daemon-help.txt; then
            echo "Missing required daemon flag: --once"
            exit 1
          fi
          fake_home="$RUNNER_TEMP/dedupe-host-guard"
          mkdir -p "$fake_home"
          set +e
          HOME="$fake_home" PREFIX="/tmp/not-termux" ANDROID_ROOT="" ANDROID_DATA="" \
            bash tools/dedupe-organizer/device_autopilot.sh > /tmp/host-guard.txt 2>&1
          code=$?
          set -e
          cat /tmp/host-guard.txt
          if [[ "$code" -ne 2 ]]; then
            echo "Host guard returned $code; expected 2"
            exit 1
          fi
          grep -q -- "authentic Android/Termux" /tmp/host-guard.txt
      - name: Verify submitted device evidence bundles
        shell: bash
        run: |
          set -euo pipefail
          root="tools/dedupe-organizer/device-evidence/runs"
          if [[ ! -d "$root" ]]; then
            echo "No device evidence runs submitted; contract tests only."
            exit 0
          fi
          found=0
          while IFS= read -r -d '' bundle; do
            found=1
            python tools/dedupe-organizer/verify_device_evidence.py "$bundle"
          done < <(find "$root" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          if [[ "$found" -eq 0 ]]; then
            echo "No device evidence runs submitted; contract tests only."
          fi
