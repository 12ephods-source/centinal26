name: site-artifact

on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'deploy/termux/serve-site.sh'
      - 'scripts/package_site.py'
      - '.github/workflows/site-artifact.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'deploy/termux/serve-site.sh'
      - 'scripts/package_site.py'
      - '.github/workflows/site-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate site
        run: python tests/validate_site.py
      - name: Compile packaging and local-server code
        run: python -m py_compile site/serve.py scripts/package_site.py
      - name: Build portable bundle
        run: python scripts/package_site.py
      - name: Verify package checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Upload portable website
        uses: actions/upload-artifact@v4
        with:
          name: automation-os-site
          path: |
            dist/automation-os-site.zip
            dist/site-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
