name: Temporary Ruff Autofix

on:
  push:
    branches:
      - fix/main-automation-ruff-autofix-20260821

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-automation-ruff-autofix-20260821
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.6'
      - name: Apply deterministic Ruff fixes
        run: ruff check . --fix || true
      - name: Commit fixes when present
        run: |
          if git diff --quiet; then
            echo 'No autofix changes.'
            exit 0
          fi
          git config user.name 'frost-automation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply deterministic Ruff autofixes [skip ci]'
          git push origin HEAD:fix/main-automation-ruff-autofix-20260821
