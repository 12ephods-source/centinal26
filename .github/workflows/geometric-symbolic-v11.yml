name: geometric-symbolic-v11

on:
  pull_request:
    paths:
      - 'experiments/geometric_symbolic_v11/**'
      - '.github/workflows/geometric-symbolic-v11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singleton-anchor-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy torch
      - name: Run frozen v11 experiment
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v11/geometric_symbolic_v11.py \
            --steps 700 \
            --out experiments/geometric_symbolic_v11/ci_results.json \
            | tee experiments/geometric_symbolic_v11/ci_stdout.log
      - name: Apply frozen v11 checker
        run: |
          set -o pipefail
          python experiments/geometric_symbolic_v11/check_results.py \
            experiments/geometric_symbolic_v11/ci_results.json \
            | tee experiments/geometric_symbolic_v11/ci_verdict.json
      - name: Record environment
        if: always()
        run: |
          python --version > experiments/geometric_symbolic_v11/ci_environment.txt 2>&1
          python - <<'PY' >> experiments/geometric_symbolic_v11/ci_environment.txt 2>&1
          import numpy, torch
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          PY
      - name: Hash evidence
        if: always()
        run: |
          sha256sum \
            experiments/geometric_symbolic_v11/geometric_symbolic_v11.py \
            experiments/geometric_symbolic_v11/check_results.py \
            experiments/geometric_symbolic_v11/ci_results.json \
            experiments/geometric_symbolic_v11/ci_verdict.json \
            experiments/geometric_symbolic_v11/ci_environment.txt \
            > experiments/geometric_symbolic_v11/ci_sha256.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometric-symbolic-v11-evidence
          path: |
            experiments/geometric_symbolic_v11/ci_results.json
            experiments/geometric_symbolic_v11/ci_stdout.log
            experiments/geometric_symbolic_v11/ci_verdict.json
            experiments/geometric_symbolic_v11/ci_environment.txt
            experiments/geometric_symbolic_v11/ci_sha256.txt
