name: Request Android Physical GA

on:
  workflow_dispatch:
    inputs:
      endurance_iterations:
        description: "Endurance iterations on Android device"
        required: true
        default: "100"

permissions:
  contents: read
  issues: write

jobs:
  create-device-job:
    runs-on: ubuntu-latest
    steps:
      - name: Create bounded physical-GA request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ITER: ${{ inputs.endurance_iterations }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="gha-${RUN_ID}-${RUN_ATTEMPT}"
          body="$(jq -n \
            --arg request_id "$request_id" \
            --arg sha "$SHA" \
            --arg iterations "$ITER" \
            '{schema:"automation.github_job/v2",request_id:$request_id,command:"automation_os_physical_ga_rc9_integrity",parameters:{endurance_iterations:($iterations|tonumber)},provenance:{github_sha:$sha},authorization:{source:"workflow_dispatch",decision:"REVIEW_DEVICE_GUARDIAN"}}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/issues" \
            -d "$(jq -n --arg title "Automation OS device job: ${request_id}" --arg body "$body" '{title:$title,body:$body,labels:["automation-os-job"]}')"
