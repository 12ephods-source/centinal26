name: Prepare Android Physical Commissioning

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  commissioning-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve canonical physical commissioning state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(jq -r '.physical_gate.qualified_source_commit' automation/PROJECT_STATE.json)"
          tracker_issue="$(jq -r '.physical_gate.tracker_issue' automation/PROJECT_STATE.json)"
          mode="$(jq -r '.physical_gate.commissioning_mode' automation/PROJECT_STATE.json)"
          test "$source_commit" != "null"
          test "$tracker_issue" != "null"
          test "$mode" = "ONE_ANDROID_RUN_PLUS_CONTROLLER_VERIFICATION"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'tracker_issue=%s\n' "$tracker_issue" >> "$GITHUB_OUTPUT"

      - name: Publish fail-closed commissioning instructions
        env:
          SOURCE: ${{ steps.state.outputs.source_commit }}
          TRACKER: ${{ steps.state.outputs.tracker_issue }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Android physical commissioning'
            echo
            echo 'This workflow does not enqueue or claim a device job.'
            echo 'The historical RC9 physical-GA command is superseded and disabled by default.'
            echo
            echo "Canonical tracker: issue #${TRACKER}"
            echo "Qualified commissioning source: \`${SOURCE}\`"
            echo
            echo 'Run on the authorized Android/Termux device:'
            echo '```bash'
            echo "SOURCE=${SOURCE}"
            echo 'URL="https://raw.githubusercontent.com/12ephods-source/centinal26/${SOURCE}/automation/deployment/enrollment_package/termux_enroll_onepaste.sh"'
            echo 'curl -fsSL "$URL" | bash -s -- "" "$SOURCE"'
            echo '```'
            echo
            echo 'Preserve the returned guardian_physical_validation_<timestamp>.zip unchanged.'
            echo 'Physical promotion remains controller- and evidence-gated.'
          } >> "$GITHUB_STEP_SUMMARY"
